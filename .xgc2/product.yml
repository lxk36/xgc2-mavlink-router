schema: xgc2.product.v1
id: xgc2-mavlink-router
name: XGC2 MAVLink Router
version: 3.0.0-13
kind: toolchain-apt
summary: XGC2 fork of mavlink-router packaged as a native Debian executable for Ubuntu
  20.04, 22.04, and 24.04.
apt:
  distribution: focal,jammy,noble
  install:
  - xgc2-mavlink-router
  packages:
  - xgc2-mavlink-router
  depends:
  - libc6
  - libgcc-s1
  - libstdc++6
  - systemd
usage:
  install: 'sudo apt update

    sudo apt install xgc2-mavlink-router

    '
  smoke_test: 'command -v mavlink-routerd

    mavlink-routerd --version

    '
release:
  apt_versions:
    focal: 3.0.0-13+focal
    jammy: 3.0.0-13+jammy
    noble: 3.0.0-13+noble
ownership:
  paths:
  - /usr/bin/mavlink-routerd
  - /lib/systemd/system/mavlink-router.service
