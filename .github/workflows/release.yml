name: release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected .xgc2/product.yml version
        required: true
        type: string
      expected_source_sha:
        description: Expected source commit SHA
        required: true
        type: string
      publish_apt:
        description: Publish debs to the APT repository
        required: true
        type: boolean
        default: false
      run_cpp_quality:
        description: Run C++ quality checks
        required: true
        type: boolean
        default: true
      run_source_tests:
        description: Run source tests
        required: true
        type: boolean
        default: true

jobs:
  release-guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Validate release inputs
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          product_version="$(awk -F': *' '/^version:[[:space:]]*/ {print $2; exit}' .xgc2/product.yml)"
          if [[ "${product_version}" != "${EXPECTED_VERSION}" ]]; then
            echo "product.yml version ${product_version} != expected_version ${EXPECTED_VERSION}" >&2
            exit 1
          fi
          source_sha="$(git rev-parse HEAD)"
          if [[ "${source_sha}" != "${EXPECTED_SOURCE_SHA}" ]]; then
            echo "HEAD ${source_sha} != expected_source_sha ${EXPECTED_SOURCE_SHA}" >&2
            exit 1
          fi

  cpp-quality:
    if: ${{ inputs.run_cpp_quality }}
    name: cpp-quality
    needs: release-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run clang-format style check on src directory
        uses: jidicula/clang-format-action@v4.11.0
        with:
          clang-format-version: "13"
          check-path: "src"

  source-tests:
    if: ${{ inputs.run_source_tests }}
    name: source-tests
    needs: release-guard
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Source tests are covered by deb build
        run: echo "build_deb_in_docker.sh runs the Meson test suite during package build."

  build:
    name: debs-${{ matrix.distro }}-${{ matrix.arch }}
    needs:
      - release-guard
      - cpp-quality
      - source-tests
    if: ${{ always() && needs.release-guard.result == 'success' && (needs.cpp-quality.result == 'success' || needs.cpp-quality.result == 'skipped') && (needs.source-tests.result == 'success' || needs.source-tests.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: focal
            ubuntu_version: "20.04"
            arch: amd64
            runner: ubuntu-latest
          - distro: focal
            ubuntu_version: "20.04"
            arch: arm64
            runner: ubuntu-24.04-arm
          - distro: jammy
            ubuntu_version: "22.04"
            arch: amd64
            runner: ubuntu-latest
          - distro: jammy
            ubuntu_version: "22.04"
            arch: arm64
            runner: ubuntu-24.04-arm
          - distro: noble
            ubuntu_version: "24.04"
            arch: amd64
            runner: ubuntu-latest
          - distro: noble
            ubuntu_version: "24.04"
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build and install-check deb package in Docker
        run: |
          set -euo pipefail
          if [[ "${{ inputs.run_source_tests }}" != "true" ]]; then
            echo "build_deb_in_docker.sh does not expose a switch to skip Meson tests; running the existing package/test/deb path." >&2
          fi
          .xgc2/scripts/build_deb_in_docker.sh \
            --ubuntu-version "${{ matrix.ubuntu_version }}" \
            --work-dir "$RUNNER_TEMP/mavlink-router-${{ matrix.distro }}-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-mavlink-router-${{ matrix.distro }}-${{ matrix.arch }}
          path: debs/*.deb

      - name: Publish to self-hosted APT repository
        if: ${{ inputs.publish_apt }}
        env:
          APT_REPO_HOST: ${{ secrets.APT_REPO_HOST }}
          APT_REPO_PORT: ${{ secrets.APT_REPO_PORT }}
          APT_REPO_SSH_KEY: ${{ secrets.APT_REPO_SSH_KEY }}
          APT_REPO_KNOWN_HOSTS: ${{ secrets.APT_REPO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          .xgc2/scripts/publish_apt_repo.sh \
            --deb-dir debs \
            --distribution "${{ matrix.distro }}"
