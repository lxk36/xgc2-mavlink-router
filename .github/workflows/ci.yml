name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  formatting-check:
    name: formatting-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run clang-format style check in XGC2 build image
        run: |
          set -euo pipefail
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE:/workspace/source:ro" \
            -w /workspace/source \
            ghcr.io/xgc-team/xgc2-images/xgc2-build-jammy-dev:1.0.0 \
            bash -lc '
              set -euo pipefail
              mapfile -d "" sources < <(
                find src -type f \
                  \( -name "*.c" -o -name "*.cc" -o -name "*.cpp" \
                     -o -name "*.h" -o -name "*.hh" -o -name "*.hpp" \) \
                  -print0 | sort -z
              )
              test "${#sources[@]}" -gt 0
              clang-format --dry-run --Werror "${sources[@]}"
            '
  build:
    name: debs-${{ matrix.distro }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: focal
            ubuntu_version: "20.04"
            arch: amd64
            runner: ubuntu-latest
          - distro: focal
            ubuntu_version: "20.04"
            arch: arm64
            runner: ubuntu-24.04-arm
          - distro: jammy
            ubuntu_version: "22.04"
            arch: amd64
            runner: ubuntu-latest
          - distro: jammy
            ubuntu_version: "22.04"
            arch: arm64
            runner: ubuntu-24.04-arm
          - distro: noble
            ubuntu_version: "24.04"
            arch: amd64
            runner: ubuntu-latest
          - distro: noble
            ubuntu_version: "24.04"
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build and install-check deb package in Docker
        run: |
          set -euo pipefail
          .xgc2/scripts/build_deb_in_docker.sh \
            --ubuntu-version "${{ matrix.ubuntu_version }}" \
            --work-dir "$RUNNER_TEMP/mavlink-router-${{ matrix.distro }}-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Create trusted build manifest
        run: |
          product_version="$(awk -F': *' '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-mavlink-router \
            --product-version "$product_version" \
            --distribution "${{ matrix.distro }}" \
            --architecture "${{ matrix.arch }}" \
            --source-sha "$GITHUB_SHA" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-mavlink-router-${{ matrix.distro }}-${{ matrix.arch }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true
